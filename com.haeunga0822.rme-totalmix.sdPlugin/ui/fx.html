<!doctype html>
<html>
<head>
	<meta charset="utf-8" />
	<script src="sdpi-components.js"></script>
</head>
<body>
	<div id="fields"></div>
	<hr />
	<div data-global></div>
	<script src="common.js"></script>
	<script>
		// Global FX: global-fx, fx-param, fx-param-dial. The action UUID picks the fields.
		const EFFECTS = { reverbEnable: 'Reverb', echoEnable: 'Echo' }
		const OPERATION = { toggle: 'Toggle', on: 'On', off: 'Off' }
		const MODES = { set: 'Set to value', step: 'Step by value (hold repeats)' }
		const FX_PARAMS = {
			reverbType: 'Reverb type', reverbPredelay: 'Reverb pre-delay', reverbLowcut: 'Reverb low cut', reverbHighcut: 'Reverb high cut',
			reverbRoomscale: 'Reverb room scale', reverbAttack: 'Reverb attack', reverbHold: 'Reverb hold', reverbRelease: 'Reverb release',
			reverbTime: 'Reverb time', reverbHighdamp: 'Reverb high damp', reverbSmooth: 'Reverb smoothness', reverbWidth: 'Reverb width',
			reverbVolume: 'Reverb volume', echoType: 'Echo type', echoDelaytime: 'Echo delay time', echoFeedback: 'Echo feedback',
			echoHighcut: 'Echo high cut', echoWidth: 'Echo width', echoVolume: 'Echo volume',
		}
		const NATIVE = 'TotalMix native unit (-10000 to 10000)'
		const KINDS = {
			'global-fx': { effect: true, operation: true },
			'fx-param': { fxParam: true, mode: true, value: ['Value', NATIVE] },
			'fx-param-dial': { fxParam: true, text: [['step', 'Step per tick', '1'], ['reset', 'Reset value (press)', NATIVE]] },
		}

		const select = (setting, label, items, extra = '') =>
			`<sdpi-item label="${label}"><sdpi-select setting="${setting}" ${extra}>${Object.entries(items)
				.map(([value, text]) => `<option value="${value}">${text}</option>`)
				.join('')}</sdpi-select></sdpi-item>`
		const field = (setting, label, placeholder) =>
			`<sdpi-item label="${label}"><sdpi-textfield setting="${setting}" placeholder="${placeholder}"></sdpi-textfield></sdpi-item>`

		async function main() {
			const client = SDPIComponents.streamDeckClient
			const { actionInfo } = await client.getConnectionInfo()
			const kind = KINDS[actionInfo.action.split('.').pop()]
			if (!kind) return
			const fields = document.getElementById('fields')

			const draw = () => {
				let html = ''
				if (kind.effect) html += select('effect', 'Effect', EFFECTS, 'placeholder="Select"')
				if (kind.fxParam) html += select('parameter', 'Parameter', FX_PARAMS, 'placeholder="Select"')
				if (kind.mode) html += select('mode', 'Mode', MODES, 'placeholder="Select"')
				if (kind.value) html += field('value', ...kind.value)
				for (const [setting, label, placeholder] of kind.text ?? []) html += field(setting, label, placeholder)
				if (kind.text) html += '<sdpi-item label=""><span>Press the dial to set the reset value; with no reset value nothing happens.</span></sdpi-item>'
				if (kind.operation) html += select('operation', 'Operation', OPERATION, 'default="toggle"')
				fields.innerHTML = html
				initFields(fields)
			}
			draw()
		}
		main()
	</script>
</body>
</html>
